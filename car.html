<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js GLB Loader in Div</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #181818;
        }
        #model-container {
            width: 80vw;
            height: 80vh;
            border: 2px solid #fff;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="model-container"></div>

    <script>
        let scene, camera, renderer, controls;

        function init() {
            const container = document.getElementById('model-container');

            // Sahne
            scene = new THREE.Scene();

            // Kamera
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 1, 3);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // Işıklandırma
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(2, 2, 5).normalize();
            scene.add(light);

            // OrbitControls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.1;

            // GLB Dosyasını Yükleme
            const loader = new THREE.GLTFLoader();
            loader.load(
                "https://threejs.org/examples/models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf", // Örnek model
                function (gltf) {
                    scene.add(gltf.scene);
                    animate();
                },
                function (xhr) {
                    console.log((xhr.loaded / xhr.total * 100) + '% yüklendi');
                },
                function (error) {
                    console.error('GLB yükleme hatası:', error);
                }
            );

            // Ekran boyutu değiştiğinde yeniden boyutlandırma
            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
